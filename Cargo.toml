[package]
name = "linux-office-installer-suite"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
env_logger = "0.11.11"
flate2 = "1.1.10"
hex = "0.4.3"
libc = "0.2"
log = "0.4.34"
md-5 = "0.11.0"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
secret-service = { version = "5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "unstable-winit-030"] }
tar = "0.4.46"
thiserror = "2.0.21"
toml = "1.1.8"
xz2 = "0.1.7"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
