# Builds and publishes the app on every push to main, and a versioned release for v* tags.
#
# - Push to main: tests, release build, then the rolling "latest" prerelease is replaced
#   with the new binary and AppImage.
# - Tag v*: the same, plus a permanent release named after the tag.
#
# Built on Ubuntu 22.04 so the binary needs glibc 2.35 or newer and runs on most distros.
# Built for x86-64-v3 (.cargo/config.toml), so it needs a Haswell / Excavator or newer CPU.
name: Release build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ASSET: linux-office-installer-suite-x86_64_v3.tar.gz
  APPIMAGE: linux-office-installer-suite-x86_64_v3.AppImage

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev liblzma-dev libxkbcommon-dev libwayland-dev libx11-dev \
            shellcheck desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: scripts/build-appimage.sh

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/linux-office-installer-suite dist/
          tar -C dist -czf "$ASSET" linux-office-installer-suite
          sha256sum "$ASSET" > "$ASSET.sha256"
          cp "target/appimage/$APPIMAGE" "target/appimage/$APPIMAGE.sha256" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-office-installer-suite
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
            ${{ env.APPIMAGE }}
            ${{ env.APPIMAGE }}.sha256

      - name: Publish the latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$ASSET" "$ASSET.sha256" "$APPIMAGE" "$APPIMAGE.sha256" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built automatically from ${GITHUB_SHA::7} on main. Experimental: not ready for production."

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" "$APPIMAGE" "$APPIMAGE.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
